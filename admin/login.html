<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — TechFix Laptop Repair Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html">
                    <img src="assets/images/logo.svg" alt="TechFix Admin" class="auth-brand-logo">
                </a>
                <h2>Technician & Admin Portal</h2>
                <p>Sign in to access workshop repair queue & billing</p>
            </div>

            <form class="auth-form" action="index.html" method="get">
                <div class="auth-group">
                    <label for="email"><i class="fas fa-envelope"></i> Engineer Email</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-at field-icon"></i>
                        <input type="email" id="email" name="email" value="aman@techfix.in" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-key field-icon"></i>
                        <input type="password" id="password" name="password" value="techfix2026" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-wrap">
                        <input type="checkbox" id="remember" name="remember" checked>
                        <span>Keep me logged in</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth-submit">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="auth-hint">
                    <i class="fas fa-info-circle"></i>
                    <span>Demo Account: <strong>aman@techfix.in</strong> (Master Engineer)</span>
                </div>
            </form>

            <div class="auth-footer">
                <div>New technician in workshop? <a href="register.html">Register Staff ID</a></div>
                <a href="../index.html" class="back-to-site">
                    <i class="fas fa-globe"></i> Back to TechFix Customer Website
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
