<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — TechFix Admin</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html">
                    <img src="assets/images/logo.svg" alt="TechFix Admin" class="auth-brand-logo">
                </a>
                <h2>Reset Engineer Password</h2>
                <p>Enter your registered work email to receive password reset OTP</p>
            </div>

            <form class="auth-form" action="login.html" method="get">
                <div class="auth-group">
                    <label for="reset-email"><i class="fas fa-envelope"></i> Engineer Email</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-at field-icon"></i>
                        <input type="email" id="reset-email" name="email" placeholder="e.g. yourname@techfix.in" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    <span>Send Reset Instructions</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <div class="auth-footer">
                <div>Remembered your password? <a href="login.html">Back to Login</a></div>
                <a href="../index.html" class="back-to-site">
                    <i class="fas fa-globe"></i> Back to TechFix Customer Website
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
