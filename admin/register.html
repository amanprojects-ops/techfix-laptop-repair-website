<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Staff Account — TechFix Admin</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html">
                    <img src="assets/images/logo.svg" alt="TechFix Admin" class="auth-brand-logo">
                </a>
                <h2>Register Technician ID</h2>
                <p>Create a technician account to manage lab repair tickets</p>
            </div>

            <form class="auth-form" action="index.html" method="get">
                <div class="auth-group">
                    <label for="fullname"><i class="fas fa-user"></i> Full Name</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-user-tag field-icon"></i>
                        <input type="text" id="fullname" name="fullname" placeholder="e.g. Rakesh Kumar" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="role"><i class="fas fa-id-badge"></i> Workshop Role / Specialty</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-tools field-icon"></i>
                        <input type="text" id="role" name="role" placeholder="e.g. Motherboard Specialist / Hardware Tech" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="reg-email"><i class="fas fa-envelope"></i> Work Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-at field-icon"></i>
                        <input type="email" id="reg-email" name="email" placeholder="e.g. rakesh@techfix.in" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="reg-password"><i class="fas fa-lock"></i> Password</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-key field-icon"></i>
                        <input type="password" id="reg-password" name="password" placeholder="Create strong password" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    <span>Create Staff Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <div>Already registered? <a href="login.html">Sign In Here</a></div>
                <a href="../index.html" class="back-to-site">
                    <i class="fas fa-globe"></i> Back to TechFix Customer Website
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
