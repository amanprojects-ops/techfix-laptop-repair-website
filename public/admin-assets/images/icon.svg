<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGradSquare" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="circuitGradSquare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowSquare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#0A0F1E" stroke="url(#primaryGradSquare)" stroke-width="2.5" />
  
  <!-- Subtle grid lines -->
  <path d="M20 50 H80 M50 20 V80" stroke="url(#circuitGradSquare)" stroke-width="1" stroke-dasharray="3 3" opacity="0.35" />
  
  <!-- Screen -->
  <rect x="25" y="24" width="50" height="34" rx="4" fill="#111827" stroke="url(#accentGradSquare)" stroke-width="2.2" />
  <!-- Screen Display Area -->
  <rect x="29" y="28" width="42" height="26" rx="2" fill="#030712" />
  
  <!-- Microchip & Circuit inside screen -->
  <rect x="42" y="35" width="16" height="12" rx="2.5" fill="url(#primaryGradSquare)" />
  <!-- Chip pins -->
  <line x1="45" y1="32" x2="45" y2="35" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="50" y1="32" x2="50" y2="35" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="55" y1="32" x2="55" y2="35" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="45" y1="47" x2="45" y2="50" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="50" y1="47" x2="50" y2="50" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="55" y1="47" x2="55" y2="50" stroke="#38BDF8" stroke-width="1.5" />
  
  <!-- Laptop Base / Keyboard deck -->
  <path d="M16 63 L22 60 H78 L84 63 C85 64 85 66 83 67 L79 69 H21 L17 67 C15 66 15 64 16 63 Z" fill="url(#primaryGradSquare)" />
  <line x1="42" y1="65" x2="58" y2="65" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" />

  <!-- Repair Spark / Lightning Pulse -->
  <path d="M68 20 L61 33 L67 33 L59 48 L73 31 L66 31 Z" fill="#38BDF8" filter="url(#glowSquare)" />
</svg>
